name: Sync client data from OneDrive

# Runs entirely on GitHub's own infrastructure (GitHub Actions) — no
# external hosting. Pulls the master transactions file from OneDrive
# (using app-only Microsoft Graph credentials, no browser/user login
# involved) and republishes each client's filtered JSON file under
# clients/*.json. Runs on a schedule and can also be triggered manually.

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync from OneDrive and publish client files
        env:
          ONEDRIVE_TENANT_ID: ${{ secrets.ONEDRIVE_TENANT_ID }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          ONEDRIVE_CLIENT_SECRET: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
          ONEDRIVE_SHARE_LINK: ${{ secrets.ONEDRIVE_SHARE_LINK }}
        run: node .github/scripts/sync-onedrive.js

      - name: Commit changes if any
        run: |
          git config user.name "onedrive-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add clients/
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Auto-sync client data from OneDrive [skip ci]"
            git push
          fi
